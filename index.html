<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUROUA Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #000000;
            --panel-bg: #121212;
            --input-bg: #1A1A1A;
            --primary-purple: #a855f7;
            --neon-glow: 0 0 15px rgba(168, 85, 247, 0.4);
            --bubble-purple: #8b5cf6;
            --bubble-dark: #262626;
            --text-light: #ffffff;
            --text-gray: #a3a3a3;
            --active-green: #22c55e;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (min-width: 500px) {
            .app-container {
                height: 90vh;
                border-radius: 40px;
                border: 4px solid var(--border-color);
                overflow: hidden;
            }
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
        }

        .screen.active {
            display: flex;
        }

        #login-screen {
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: linear-gradient(180deg, #0a0118 0%, #000000 100%);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-text {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(to left, #e879f9, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-card {
            width: 100%;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: var(--neon-glow);
        }

        .tabs-header {
            display: flex;
            background-color: var(--bg-dark);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-gray);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
        }

        .tab-btn.active {
            background-color: var(--primary-purple);
            color: var(--text-light);
        }

        .input-box {
            margin-bottom: 1.2rem;
        }

        .input-box input {
            width: 100%;
            padding: 15px;
            background-color: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-light);
            font-size: 1rem;
            outline: none;
        }

        .input-box input:focus {
            border-color: var(--primary-purple);
        }

        .auth-btn {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-purple);
            border: none;
            border-radius: 14px;
            color: var(--text-light);
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: var(--neon-glow);
        }

        .chat-header {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--panel-bg);
        }

        .brand-logo {
            font-weight: 900;
            font-size: 1.5rem;
            background: linear-gradient(to left, #e879f9, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logout-btn {
            cursor: pointer;
            color: var(--text-gray);
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .stories-wrapper {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
            overflow-x: auto;
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 75px;
            cursor: pointer;
        }

        .story-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366); 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .story-img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: #222;
            border: 2px solid var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .story-note {
            position: absolute;
            top: -5px;
            background-color: #1e1b4b;
            border: 1px solid var(--primary-purple);
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 0.65rem;
            max-width: 60px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .story-name {
            font-size: 0.75rem;
            margin-top: 5px;
            color: var(--text-gray);
        }

        .chat-list-container {
            flex: 1;
            overflow-y: auto;
        }

        .user-row {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #0a0a0a;
        }

        .user-row:hover {
            background-color: var(--panel-bg);
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--primary-purple);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin-left: 15px;
        }

        .user-info {
            flex: 1;
        }

        .user-fullname {
            font-weight: bold;
            font-size: 1rem;
            display: block;
        }

        .last-msg {
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .chat-room-header {
            padding: 15px;
            display: flex;
            align-items: center;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            cursor: pointer;
            margin-left: 15px;
            font-weight: bold;
            color: var(--primary-purple);
        }

        .messages-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-wrapper {
            display: flex;
            width: 100%;
        }

        .message-wrapper.outgoing { justify-content: flex-start; }
        .message-wrapper.incoming { justify-content: flex-end; }

        .message-box {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
        }

        .message-wrapper.outgoing .message-box {
            background-color: var(--bubble-purple);
            color: white;
        }

        .message-wrapper.incoming .message-box {
            background-color: var(--bubble-dark);
            color: white;
        }

        .chat-input-area {
            padding: 15px;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            color: white;
            outline: none;
        }

        .send-btn {
            padding: 10px 20px;
            background-color: var(--primary-purple);
            border: none;
            border-radius: 24px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            width: 80%;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            background: #000;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- SCREEN 1: LOGIN -->
        <div id="login-screen" class="screen active">
            <div class="logo-area">
                <div class="logo-text">BOUROUA</div>
                <div class="logo-sub">NEON CONNECT</div>
            </div>

            <div class="auth-card">
                <div class="tabs-header">
                    <button class="tab-btn active" id="t-login" onclick="switchTab('login')">تسجيل دخول</button>
                    <button class="tab-btn" id="t-signup" onclick="switchTab('signup')">حساب جديد</button>
                </div>

                <div class="input-box">
                    <input type="text" id="username-input" placeholder="اسم المستخدم">
                </div>
                <div class="input-box" id="fullname-wrapper" style="display: none;">
                    <input type="text" id="fullname-input" placeholder="الاسم الكامل">
                </div>
                <div class="input-box">
                    <input type="password" id="password-input" placeholder="كلمة المرور">
                </div>
                <button class="auth-btn" onclick="handleAuth()" id="submit-btn">دخول</button>
            </div>
        </div>

        <!-- SCREEN 2: HOME CHATS -->
        <div id="chat-home-screen" class="screen">
            <div class="chat-header">
                <div class="brand-logo">BOUROUA ✨</div>
                <div class="logout-btn" onclick="logout()">خروج</div>
            </div>

            <div class="stories-wrapper" id="stories-section">
                <div class="story-item" onclick="openModal()">
                    <div class="story-ring">
                        <div class="story-img" id="my-avatar">أ</div>
                        <div class="story-note" id="my-note">+ لقطة</div>
                    </div>
                    <div class="story-name">لقطتك</div>
                </div>
                <div id="other-stories" style="display: flex; gap: 15px;"></div>
            </div>

            <div class="chat-list-container" id="chat-list"></div>
        </div>

        <!-- SCREEN 3: CHAT ROOM -->
        <div id="active-chat-screen" class="screen">
            <div class="chat-room-header">
                <div class="back-btn" onclick="backToHome()">➔ العودة</div>
                <div style="font-weight: bold;" id="chat-title">اسم المستخدم</div>
            </div>
            <div class="messages-container" id="message-stream"></div>
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="اكتب رسالة...">
                <button class="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>

        <!-- MODAL -->
        <div class="modal" id="note-modal">
            <div class="modal-content">
                <h3>تحديث لقطتك الخاطفة</h3>
                <input type="text" id="note-input" placeholder="اكتب حالتك السريعة هنا..." maxlength="20">
                <button class="send-btn" onclick="saveNote()">حفظ</button>
                <button class="send-btn" style="background:#333; margin-top:5px;" onclick="closeModal()">إلغاء</button>
            </div>
        </div>

    </div>

    <!-- استدعاء Firebase السحابي المباشر -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAv9vBIVgUOY2qvqfH0oFMnFMCexTxGk7w",
            authDomain: "bouroua-chat.firebaseapp.com",
            projectId: "bouroua-chat",
            storageBucket: "bouroua-chat.appspot.com",
            messagingSenderId: "574671036262",
            appId: "1:574671036262:web:9b7920b0bf945a5f7a32a7",
            databaseURL: "https://bouroua-chat-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let mode = 'login';
        let currentUser = null;
        let activeRecipient = null;
        let allUsers = [];

        window.switchTab = function(t) {
            mode = t;
            document.getElementById('t-login').classList.toggle('active', t === 'login');
            document.getElementById('t-signup').classList.toggle('active', t === 'signup');
            document.getElementById('fullname-wrapper').style.display = t === 'signup' ? 'block' : 'none';
            document.getElementById('submit-btn').innerText = t === 'login' ? 'دخول' : 'إنشاء حساب ودخول';
        }

        window.handleAuth = function() {
            let userIn = document.getElementById('username-input').value.trim().toLowerCase();
            let fullIn = document.getElementById('fullname-input').value.trim();
            let passIn = document.getElementById('password-input').value;

            if(!userIn || !passIn) { alert('يرجى ملء البيانات!'); return; }

            const userRef = ref(db, 'users/' + userIn);

            if(mode === 'login') {
                get(userRef).then((snapshot) => {
                    if (snapshot.exists()) {
                        let userData = snapshot.val();
                        if(userData.password === passIn) {
                            currentUser = userData;
                            enterApp();
                        } else { alert('كلمة المرور خاطئة!'); }
                    } else { alert('اسم المستخدم غير موجود!'); }
                });
            } else {
                if(!fullIn) { alert('اكتب الاسم الكامل!'); return; }
                get(userRef).then((snapshot) => {
                    if (snapshot.exists()) {
                        alert('اسم المستخدم محجوز بالفعل!');
                    } else {
                        const colors = ['#a855f7', '#3b82f6', '#ec4899', '#10b981', '#f59e0b'];
                        let randomColor = colors[Math.floor(Math.random() * colors.length)];
                        
                        currentUser = { username: userIn, fullname: fullIn, password: passIn, note: 'متصل أونلاين ⚡', color: randomColor };
                        set(ref(db, 'users/' + userIn), currentUser).then(() => {
                            enterApp();
                        });
                    }
                });
            }
        }

        function enterApp() {
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('chat-home-screen').classList.add('active');
            
            document.getElementById('my-avatar').innerText = currentUser.fullname.charAt(0);
            document.getElementById('my-note').innerText = currentUser.note || '+ لقطة';

            listenToUpdates();
        }

        function listenToUpdates() {
            onValue(ref(db, 'users'), (snapshot) => {
                allUsers = [];
                if(snapshot.exists()) {
                    let data = snapshot.val();
                    for(let key in data) { allUsers.push(data[key]); }
                }
                loadHomeData();
            });

            onValue(ref(db, 'chats'), () => {
                loadHomeData();
                if(activeRecipient) { renderMessages(); }
            });
        }

        function loadHomeData() {
            let storiesDiv = document.getElementById('other-stories');
            if(storiesDiv) storiesDiv.innerHTML = '';

            let listDiv = document.getElementById('chat-list');
            if(listDiv) listDiv.innerHTML = '';

            allUsers.forEach(u => {
                if(!currentUser || u.username === currentUser.username) return;

                let div = document.createElement('div');
                div.className = 'story-item';
                div.onclick = () => startChat(u);
                div.innerHTML = `<div class="story-ring"><div class="story-img" style="background:${u.color}">${u.fullname.charAt(0)}</div><div class="story-note">${u.note || ''}</div></div><div class="story-name">${u.fullname}</div>`;
                if(storiesDiv) storiesDiv.appendChild(div);

                let row = document.createElement('div');
                row.className = 'user-row';
                row.onclick = () => startChat(u);
                row.innerHTML = `<div class="user-avatar" style="background:${u.color}">${u.fullname.charAt(0)}</div><div class="user-info"><span class="user-fullname">${u.fullname}</span><span class="last-msg">اضغط لبدء دردشة حية ومشتركة...</span></div>`;
                if(listDiv) listDiv.appendChild(row);
            });
        }

        function startChat(user) {
            activeRecipient = user;
            document.getElementById('chat-home-screen').classList.remove('active');
            document.getElementById('active-chat-screen').classList.add('active');
            document.getElementById('chat-title').innerText = user.fullname;
            renderMessages();
        }

        function renderMessages() {
            get(ref(db, 'chats')).then((snapshot) => {
                let stream = document.getElementById('message-stream');
                if(!stream) return;
                stream.innerHTML = '';

                if(snapshot.exists()) {
                    let data = snapshot.val();
                    for(let key in data) {
                        let m = data[key];
                        if((m.sender === currentUser.username && m.receiver === activeRecipient.username) || 
                           (m.sender === activeRecipient.username && m.receiver === currentUser.username)) {
                            
                            let side = m.sender === currentUser.username ? 'outgoing' : 'incoming';
                            let box = document.createElement('div');
                            box.className = `message-wrapper ${side}`;
                            box.innerHTML = `<div class="message-box">${m.text}</div>`;
                            stream.appendChild(box);
                        }
                    }
                }
                stream.scrollTop = stream.scrollHeight;
            });
        }

        window.sendMessage = function() {
            let input = document.getElementById('msg-input');
            let text = input.value.trim();
            if(!text) return;

            let chatsRef = ref(db, 'chats');
            let newChatRef = push(chatsRef);
            set(newChatRef, {
                sender: currentUser.username,
                receiver: activeRecipient.username,
                text: text,
                timestamp: Date.now()
            }).then(() => {
                input.value = '';
                renderMessages();
            });
        }

        window.backToHome = function() {
            activeRecipient = null;
            document.getElementById('active-chat-screen').classList.remove('active');
            document.getElementById('chat-home-screen').classList.add('active');
            loadHomeData();
        }

        window.openModal = function() { document.getElementById('note-modal').style.display = 'flex'; }
        window.closeModal = function() { document.getElementById('note-modal').style.display = 'none'; }
        
        window.saveNote = function() {
            let txt = document.getElementById('note-input').value.trim();
            if(!txt) return;
            
            currentUser.note = txt;
            set(ref(db, 'users/' + currentUser.username + '/note'), txt).then(() => {
                document.getElementById('my-note').innerText = txt;
                closeModal();
            });
        }

        window.logout = function() {
            currentUser = null;
            document.getElementById('chat-home-screen').classList.remove('active');
            document.getElementById('login-screen').classList.add('active');
        }
    </script>
</body>
</html>
